# ==============================================================================
# OpenFlow L3 Routing Table Configuration for OVS-DPDK (br-dpdk)
# Single Source of Truth (SSOT) for Route & Security Policies
# ==============================================================================
# Syntax: <PRIORITY> <IP_CIDR> <ACTION> <DESCRIPTION>
# Action: FORWARD (output to vhost-user-1) | DROP (discard at vSwitch)
# ==============================================================================

# 1. Security Drop Rules (Priority 200 - Highest precedence, ingress from Pod 0)
200 157.240.0.0/16 DROP    Meta/Facebook traffic blocked at vSwitch
200 96.127.0.0/16  DROP    Amazon AWS test traffic blocked at vSwitch

# 2. Priority Forwarding Rules (Priority 100 - High speed egress to Pod 1)
100 172.217.0.0/16 FORWARD Google Services (Search, YouTube)
100 142.250.0.0/16 FORWARD Google Cloud & APIs

# 3. Default L3 Routing (Priority 50)
50  0.0.0.0/0      FORWARD Default L3 route forwarding to Pod 1

# 4. Reverse Path (Priority 10 - Pod 1 to Pod 0)
10  ANY            FORWARD Return path from Pod 1 to Pod 0

# 5. Control Traffic Isolation (Priority 1)
1   ARP            DROP    Isolate ARP to prevent packet count skewing
