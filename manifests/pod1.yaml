apiVersion: v1
kind: Pod
metadata:
  name: dpdk-pod1
  labels:
    app: dpdk-l3-bridge
    role: responder
spec:
  restartPolicy: Never
  containers:
  - name: pod1-responder
    image: pod1:latest
    imagePullPolicy: IfNotPresent
    securityContext:
      privileged: true
    command: ["/app/pod1_app"]
    args:
      - "-l", "3-4"
      - "--no-pci"
      - "--vdev=virtio_user0,path=/var/run/openvswitch/vhost-user-1,server=1"
      - "--"
      - "--config", "/app/routes.conf"
    resources:
      requests:
        memory: "512Mi"
        cpu: "1"
      limits:
        memory: "1Gi"
        cpu: "2"
    volumeMounts:
    - name: hugepages
      mountPath: /dev/hugepages
    - name: ovs-sockets
      mountPath: /var/run/openvswitch
  volumes:
  - name: hugepages
    hostPath:
      path: /dev/hugepages
  - name: ovs-sockets
    hostPath:
      path: /var/run/openvswitch
